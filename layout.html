<!-- 상단 검색바 -->
<header class="topbar">
  <form class="searchbar" action="search.html" method="get" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input type="search" name="q" placeholder="검색" aria-label="검색어 입력" autocomplete="off">
  </form>
  <button type="button" class="btn-logout admin-only" id="logoutBtn">관리자 로그아웃</button>
</header>

<!-- 관리자 로그인 모달 -->
<dialog id="loginModal" class="modal modal-sm" aria-labelledby="loginTitle">
  <form method="dialog" class="login-form" id="loginForm">
    <h2 id="loginTitle">관리자 확인</h2>
    <p class="muted">글을 올리려면 비밀번호가 필요해요.</p>
    <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="error" id="loginError" role="alert" hidden>비밀번호가 맞지 않아요. 다시 입력해 주세요.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="loginCancel">취소</button>
      <button type="submit" class="btn btn-primary">확인</button>
    </div>
  </form>
</dialog>
